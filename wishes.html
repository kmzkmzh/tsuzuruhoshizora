	<script>
		(() => {
			const intro = document.querySelector('.wish-collection-intro');
			if (!intro) return;

			const navigationEntry = performance.getEntriesByType('navigation')[0];
			const referrerPath = document.referrer ? new URL(document.referrer).pathname : '';
			const cameFromWishPage = /\/wishes\/[^/]+\.html$/i.test(referrerPath);
			const returnedFromWishPage = sessionStorage.getItem('skip-wishes-intro') === 'true';
			if (returnedFromWishPage) sessionStorage.removeItem('skip-wishes-intro');
			if (navigationEntry?.type === 'back_forward' || cameFromWishPage || returnedFromWishPage) {
				intro.remove();
				document.body.classList.remove('wish-intro-active');
				return;
			}

			const chart = intro.querySelector('.wish-collection-chart');
			const sparkles = [...chart.querySelectorAll('.wish-collection-sparkle')];
			const chartInner = chart.querySelector('.wish-collection-chart__inner');
			const message = intro.querySelector('.wish-collection-message');
			const count = intro.querySelector('.wish-collection-count');
			const activeNumberSparkles = new Set();
			const target = 240;
			const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
			const previousOverflow = document.body.style.overflow;
			let lastNumberSparkAt = 0;
			document.body.style.overflow = 'hidden';

			window.addEventListener('pageshow', (event) => {
				if (!event.persisted) return;
				intro.remove();
				document.body.classList.remove('wish-intro-active');
				document.body.style.overflow = previousOverflow;
			});

			chart.classList.add('is-playing');

			const finish = () => {
				intro.classList.add('is-leaving');
				document.body.style.overflow = previousOverflow;
				window.setTimeout(() => {
					document.body.classList.remove('wish-intro-active');
					intro.remove();
				}, 1200);
			};

			if (reducedMotion) {
				count.textContent = String(target);
				chart.style.setProperty('--progress', '360deg');
				message.classList.add('is-playing');
				window.setTimeout(finish, 1800);
				return;
			}

			const addNumberSparkle = (now) => {
				if (now - lastNumberSparkAt < 90 || activeNumberSparkles.size >= 8) return;
				lastNumberSparkAt = now;

				const sparkle = document.createElement('span');
				sparkle.className = 'wish-collection-number-sparkle';
				sparkle.setAttribute('aria-hidden', 'true');
				sparkle.textContent = Math.random() > 0.5 ? '✦' : '✧';
				sparkle.style.setProperty('--spark-x', `${Math.random() * 150 - 75}px`);
				sparkle.style.setProperty('--spark-y', `${Math.random() * 54 - 27}px`);
				sparkle.style.setProperty('--spark-dx', `${Math.random() * 44 - 22}px`);
				sparkle.style.setProperty('--spark-dy', `${-18 - Math.random() * 26}px`);
				chartInner.appendChild(sparkle);
				activeNumberSparkles.add(sparkle);
				sparkle.addEventListener('animationend', () => {
					activeNumberSparkles.delete(sparkle);
					sparkle.remove();
				}, { once: true });
			};

			window.setTimeout(() => {
				const startedAt = performance.now();
				const duration = 3200;
				chart.classList.add('is-counting');

				const animateCount = (now) => {
					const progress = Math.min((now - startedAt) / duration, 1);
					const eased = progress < 0.5
						? 4 * progress * progress * progress
						: 1 - Math.pow(-2 * progress + 2, 3) / 2;
					const current = Math.round(target * eased);
					if (count.textContent !== String(current)) {
						count.textContent = String(current);
						addNumberSparkle(now);
					}
					chart.style.setProperty('--progress', `${360 * eased}deg`);
					sparkles.forEach((sparkle, index) => {
						sparkle.style.setProperty('--spark-angle', `${-90 + eased * 360 - index * 12}deg`);
						if (eased * 360 < index * 12) {
							sparkle.style.opacity = '0';
						} else {
							sparkle.style.removeProperty('opacity');
						}
					});

					if (progress < 1) {
						requestAnimationFrame(animateCount);
					} else {
						window.setTimeout(() => chart.classList.remove('is-counting'), 750);
						message.classList.add('is-playing');
					}
				};

				requestAnimationFrame(animateCount);
			}, 700);

			window.setTimeout(finish, 5600);
		})();
	</script>

			6: { category: '勉強', tags: ['学生', '夕方'], zodiac: '獅子座', gender: '女性' },
			7: { category: '夢', tags: ['学生', '夜'], zodiac: '水瓶座', gender: '女性' },
			8: { category: '趣味', tags: ['学生', '夜'], zodiac: '射手座', gender: '女性' },
			10: { category: '夢', tags: ['学生', '夜'], zodiac: '魚座', gender: '女性' },
			11: { category: '恋愛', tags: ['学生', '夜'], zodiac: '天秤座', gender: '女性' },
			12: { category: '恋愛', tags: ['学生', '夜'], zodiac: '牡牛座', gender: '女性' },
			13: { category: '夢', tags: ['学生', '夜'], zodiac: '牡牛座', gender: '男性' },
			14: { category: 'その他', tags: ['学生', '夜'], zodiac: '射手座', gender: '女性' },
			15: { category: 'お金', tags: ['学生', '夜'], zodiac: '山羊座', gender: '男性' },
			16: { category: '夢', tags: ['学生', '朝'], zodiac: '天秤座', gender: '女性' },
			17: { category: 'その他', tags: ['学生', '夜'], zodiac: '魚座', gender: '女性' },
			18: { category: '健康', tags: ['学生', '夜'] },
		};

		const wishData = Array.from({ length: 398 }, (_, index) => {
			const number = index + 1;
			const padded = String(number).padStart(3, '0');
			const fileNumber = number < 10 ? `00${number}` : number < 100 ? `0${number}` : String(number);
			const pageId = `wish${fileNumber}`;
			const image = imageMap[number] || '';
			const folder = imageMap[number]?.split('/')[1];
			const metadata = wishMetadata[number] || {};
			const category = metadata.category || folderCategories[folder] || '未分類';
			const categoryColor = folder === 'survey×' ? 'survey' : folder || {
				健康: 'health', 夢: 'dream', 家族: 'family', 趣味: 'hobby',
				恋愛: 'love', お金: 'money', その他: 'other', 勉強: 'study',
				仕事: 'work', 友達: 'friend'
			}[category] || 'other';
			const tags = [category, ...(metadata.tags || []), metadata.zodiac, metadata.ageGroup, metadata.gender].filter(Boolean);

			return {
				id: pageId,
				title: `たんざく${padded}`,
				url: `wishes/${pageId}.html`,
				category,
				categoryColor,
				zodiac: metadata.zodiac || '',
				ageGroup: metadata.ageGroup || '',
				gender: metadata.gender || '',
				tags,
				image
			};
		});
		const visibleWishData = wishData.filter((item) => item.image);

		const tagFilters = document.getElementById('tag-filters');
		const wishList = document.getElementById('wish-list');
		const zodiacFilter = document.getElementById('zodiac-filter');
		const ageFilter = document.getElementById('age-filter');
		const genderFilter = document.getElementById('gender-filter');
		const tagSearch = document.getElementById('tag-search');
		const filterSummary = document.getElementById('filter-summary');
		const duplicateTags = document.getElementById('duplicate-tags');
		const wishSky = document.getElementById('wish-sky');
		const wishSkyViewport = document.getElementById('wish-sky-viewport');
		const wishSkyMap = document.getElementById('wish-sky-map');
		const wishSkyCenterButton = document.getElementById('wish-sky-center');
		const listViewButton = document.getElementById('wish-list-view-button');
		const skyViewButton = document.getElementById('wish-sky-view-button');
		let activeCategory = 'すべて';
		const returnWishId = sessionStorage.getItem('wishListReturnId');
		const returnCardTop = Number(sessionStorage.getItem('wishListReturnCardTop'));
		const returnScrollY = Number(sessionStorage.getItem('wishListReturnScrollY'));
		const returnCategory = sessionStorage.getItem('wishListReturnCategory');
		const returnZodiac = sessionStorage.getItem('wishListReturnZodiac');
		const returnAge = sessionStorage.getItem('wishListReturnAge');
		const returnGender = sessionStorage.getItem('wishListReturnGender');
		const returnTagQuery = sessionStorage.getItem('wishListReturnTagQuery');
		const returnView = sessionStorage.getItem('wishListReturnView');
		const returnSkyLeft = Number(sessionStorage.getItem('wishListReturnSkyLeft'));
		const returnSkyTop = Number(sessionStorage.getItem('wishListReturnSkyTop'));

		if (returnWishId) {
			[
				'wishListReturnId',
				'wishListReturnCardTop',
				'wishListReturnScrollY',
				'wishListReturnCategory',
				'wishListReturnZodiac',
				'wishListReturnAge',
				'wishListReturnGender',
				'wishListReturnTagQuery',
				'wishListReturnView',
				'wishListReturnSkyLeft',
				'wishListReturnSkyTop'
			].forEach((key) => sessionStorage.removeItem(key));
		}

		let hasCenteredSky = false;

		function centerSkyMap() {
			const x = Number(wishSkyMap.dataset.focusX) || wishSkyMap.clientWidth / 2;
			const y = Number(wishSkyMap.dataset.focusY) || wishSkyMap.clientHeight / 2;
			wishSkyViewport.scrollLeft = Math.max(0, x - wishSkyViewport.clientWidth / 2);
			wishSkyViewport.scrollTop = Math.max(0, y - wishSkyViewport.clientHeight / 2);
		}

		function setView(view) {
			const showSky = view === 'sky';
			wishList.hidden = showSky;
			wishSky.hidden = !showSky;
			listViewButton.classList.toggle('is-active', !showSky);
			listViewButton.setAttribute('aria-pressed', String(!showSky));
			skyViewButton.classList.toggle('is-active', showSky);
			skyViewButton.setAttribute('aria-pressed', String(showSky));
			if (showSky && !hasCenteredSky) {
				hasCenteredSky = true;
				requestAnimationFrame(centerSkyMap);
			}
		}

		function rememberWishListReturn(item, link) {
			localStorage.setItem(`wishViewed:${item.id}`, 'true');
			link.classList.add('is-viewed');
			sessionStorage.setItem('wishListReturnId', item.id);
			sessionStorage.setItem('wishListReturnCardTop', String(link.getBoundingClientRect().top));
			sessionStorage.setItem('wishListReturnScrollY', String(window.scrollY));
			sessionStorage.setItem('wishListReturnCategory', activeCategory);
			sessionStorage.setItem('wishListReturnZodiac', zodiacFilter.value);
			sessionStorage.setItem('wishListReturnAge', ageFilter.value);
			sessionStorage.setItem('wishListReturnGender', genderFilter.value);
			sessionStorage.setItem('wishListReturnTagQuery', tagSearch.value);
			sessionStorage.setItem('wishListReturnView', viewIsSky() ? 'sky' : 'list');
			sessionStorage.setItem('wishListReturnSkyLeft', String(wishSkyViewport.scrollLeft));
			sessionStorage.setItem('wishListReturnSkyTop', String(wishSkyViewport.scrollTop));
		}

		function viewIsSky() {
			return !wishSky.hidden;
		}

		function populateSelect(select, key, label) {
			const values = [...new Set(visibleWishData.map((item) => item[key]).filter(Boolean))].sort();
			select.innerHTML = '';
			const allOption = document.createElement('option');
			allOption.value = '';
			allOption.textContent = values.length ? `${label}すべて` : `${label}未登録`;
			select.appendChild(allOption);
			values.forEach((value) => {
				const option = document.createElement('option');
				option.value = value;
				option.textContent = value;
				select.appendChild(option);
			});
			select.disabled = values.length === 0;
		}

		function renderFilters() {
			tagFilters.innerHTML = '';
			['すべて', ...categoryNames, '未分類'].forEach((category) => {
				const button = document.createElement('button');
				button.type = 'button';
				button.className = 'tag-btn' + (category === activeCategory ? ' active' : '');
				button.textContent = category;
				button.addEventListener('click', () => {
					activeCategory = category;
					renderFilters();
					renderList();
				});
				tagFilters.appendChild(button);
			});
		}

		function renderDuplicateTags() {
			const counts = new Map();
			visibleWishData.forEach((item) => {
				[...new Set(item.tags)]
					.filter((tag) => !categoryNames.includes(tag) && tag !== '未分類')
					.forEach((tag) => counts.set(tag, (counts.get(tag) || 0) + 1));
			});
			const repeated = [...counts.entries()].filter(([, count]) => count > 1);
			duplicateTags.innerHTML = '<span class="duplicate-tags-label">重複タグ:</span>';
			repeated.forEach(([tag, count]) => {
				const button = document.createElement('button');
				button.type = 'button';
				button.className = 'duplicate-tag-btn';
				button.textContent = `${tag} (${count})`;
				button.setAttribute('aria-label', `タグ ${tag} を持つ ${count} 件を表示`);
				button.addEventListener('click', () => {
					tagSearch.value = tag;
					activeCategory = 'すべて';
					renderFilters();
					renderList();
				});
				duplicateTags.appendChild(button);
			});
		}

		function renderList() {
			const recenterSky = !wishSky.hidden;
			const query = tagSearch.value.trim().toLocaleLowerCase();
			const filtered = visibleWishData.filter((item) => {
				const matchesCategory = activeCategory === 'すべて' || item.category === activeCategory;
				const matchesZodiac = !zodiacFilter.value || item.zodiac === zodiacFilter.value;
				const matchesAge = !ageFilter.value || item.ageGroup === ageFilter.value;
				const matchesGender = !genderFilter.value || item.gender === genderFilter.value;
				const searchable = item.tags.join(' ').toLocaleLowerCase();
				return matchesCategory && matchesZodiac && matchesAge && matchesGender && (!query || searchable.includes(query));
			});

			wishList.innerHTML = '';
			filterSummary.textContent = `${filtered.length}件 / ${visibleWishData.length}件`;

			filtered.forEach((item) => {
				const card = document.createElement('a');
				card.href = item.url;
				card.className = `wish-card wish-card--${item.categoryColor}`;
				card.dataset.wishId = item.id;
				card.addEventListener('click', () => {
					rememberWishListReturn(item, card);
				});

				if (item.image) {
					const thumb = document.createElement('div');
					thumb.className = 'wish-thumb';
					const thumbImg = document.createElement('img');
					thumbImg.src = item.image;
					thumbImg.alt = item.title;
					thumbImg.addEventListener('error', () => thumb.remove(), { once: true });
					thumb.appendChild(thumbImg);
					card.appendChild(thumb);
				}

				const body = document.createElement('div');
				body.className = 'wish-body';

				const title = document.createElement('h3');
				title.textContent = item.title;

				const meta = document.createElement('div');
				meta.className = 'wish-meta';

				item.tags.forEach((tag) => {
					const chip = document.createElement('span');
					chip.className = 'wish-tag';
					chip.textContent = tag;
					meta.appendChild(chip);
				});

				body.appendChild(title);
				body.appendChild(meta);
				card.appendChild(body);
				wishList.appendChild(card);
			});

			renderSky(filtered);
			hasCenteredSky = false;
			if (recenterSky) {
				hasCenteredSky = true;
				requestAnimationFrame(centerSkyMap);
			}
		}

		function renderSky(items) {
			wishSkyMap.replaceChildren();
			const mapWidth = 3600;
			const mapHeight = 2400;
			wishSkyMap.style.width = `${mapWidth}px`;
			wishSkyMap.style.height = `${mapHeight}px`;

			let backgroundSeed = 19840707;
			const backgroundRandom = () => {
				backgroundSeed = (Math.imul(backgroundSeed, 1664525) + 1013904223) >>> 0;
				return backgroundSeed / 4294967296;
			};
			const distantStars = document.createElement('div');
			distantStars.className = 'wish-sky-distant-stars';
			distantStars.setAttribute('aria-hidden', 'true');
			for (let index = 0; index < 280; index++) {
				const distantStar = document.createElement('span');
				distantStar.className = 'wish-sky-distant-star';
				distantStar.style.left = `${backgroundRandom() * 100}%`;
				distantStar.style.top = `${backgroundRandom() * 100}%`;
				distantStar.style.setProperty('--distant-star-size', `${0.8 + backgroundRandom() * 1.6}px`);
				distantStar.style.setProperty('--distant-star-opacity', `${0.2 + backgroundRandom() * 0.6}`);
				distantStars.appendChild(distantStar);
			}
			wishSkyMap.appendChild(distantStars);
			wishSkyMap.dataset.focusX = `${mapWidth / 2}`;
			wishSkyMap.dataset.focusY = `${mapHeight / 2}`;
			if (!items.length) {
				const emptyMessage = document.createElement('p');
				emptyMessage.className = 'wish-sky-cluster-placeholder';
				emptyMessage.textContent = '条件に一致する短冊がありません';
				wishSkyMap.appendChild(emptyMessage);
				return;
			}

			const tagCounts = new Map();
			items.forEach((item) => {
				[...new Set(item.tags)]
					.filter((tag) => !categoryNames.includes(tag) && tag !== '未分類')
					.forEach((tag) => tagCounts.set(tag, (tagCounts.get(tag) || 0) + 1));
			});

			const groups = new Map();
			items.forEach((item) => {
				const sharedTags = [...new Set(item.tags)]
					.filter((tag) => !categoryNames.includes(tag) && tag !== '未分類' && tagCounts.get(tag) > 1)
					.sort((first, second) => tagCounts.get(second) - tagCounts.get(first));
				const groupTag = sharedTags[0] || item.category;
				if (!groups.has(groupTag)) groups.set(groupTag, []);
				groups.get(groupTag).push(item);
			});

			const orderedGroups = [...groups.entries()]
				.sort(([firstTag, firstItems], [secondTag, secondItems]) =>
					secondItems.length - firstItems.length || firstTag.localeCompare(secondTag, 'ja')
				);

			const placements = [];
			orderedGroups.forEach(([tag, groupItems], index) => {
				let seed = [...tag].reduce((value, character) => (Math.imul(value, 31) + character.charCodeAt(0)) >>> 0, 2166136261);
				const random = () => {
					seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
					return seed / 4294967296;
				};
				const radius = 110 + Math.sqrt(groupItems.length) * 18;
				let placement = null;
				let bestScore = -Infinity;

				for (let attempt = 0; attempt < 240; attempt++) {
					const x = radius + 130 + random() * (mapWidth - radius * 2 - 260);
					const y = radius + 130 + random() * (mapHeight - radius * 2 - 260);
					const score = placements.length
						? Math.min(...placements.map((other) => Math.hypot(x - other.x, y - other.y) - radius - other.radius - 130))
						: Infinity;
					if (score > bestScore) {
						bestScore = score;
						placement = { x, y, radius, random };
					}
					if (score >= 0) break;
				}

				placements.push({ ...placement, tag });
				if (index === 0) {
					wishSkyMap.dataset.focusX = `${placement.x}`;
					wishSkyMap.dataset.focusY = `${placement.y}`;
				}
			});

			orderedGroups.forEach(([tag, groupItems], groupIndex) => {
					const placement = placements[groupIndex];
					const random = placement.random;
					const starPositions = [];
					groupItems.forEach(() => {
						let position = null;
						let bestClearance = -Infinity;
						for (let attempt = 0; attempt < 120; attempt++) {
							const angle = random() * Math.PI * 2;
							const distance = placement.radius * Math.sqrt(random()) * 0.94;
							const candidate = {
								x: placement.radius + Math.cos(angle) * distance,
								y: placement.radius + Math.sin(angle) * distance
							};
							const clearance = starPositions.length
								? Math.min(...starPositions.map((other) => Math.hypot(candidate.x - other.x, candidate.y - other.y) - 30))
								: Infinity;
							if (clearance > bestClearance) {
								bestClearance = clearance;
								position = candidate;
							}
							if (clearance >= 0) break;
						}
						starPositions.push(position);
					});
					const cluster = document.createElement('section');
					cluster.className = 'wish-sky-cluster';
					cluster.setAttribute('aria-label', `タグ ${tag} の願い事 ${groupItems.length}件`);
					cluster.style.left = `${placement.x}px`;
					cluster.style.top = `${placement.y}px`;
					cluster.style.width = `${placement.radius * 2}px`;
					cluster.style.height = `${placement.radius * 2}px`;
					cluster.style.setProperty('--cluster-radius', `${placement.radius}px`);

					const categoryCounts = new Map();
					groupItems.forEach((item) => categoryCounts.set(item.categoryColor, (categoryCounts.get(item.categoryColor) || 0) + 1));
					const dominantColor = [...categoryCounts.entries()].sort((first, second) => second[1] - first[1])[0][0];
					cluster.classList.add(`wish-card--${dominantColor}`);

					const density = Math.min(1, groupItems.length / 28);
					cluster.style.setProperty('--cluster-glow-alpha', `${0.06 + density * 0.18}`);
					const label = document.createElement('h3');
					label.className = 'wish-sky-cluster-label';
					label.textContent = `${tag} · ${groupItems.length}件`;
					cluster.appendChild(label);

					groupItems.forEach((item, index) => {
						const star = document.createElement('a');
						const position = starPositions[index];
						star.className = 'wish-sky-star';
						star.href = item.url;
						star.dataset.wishId = item.id;
						const isViewed = localStorage.getItem(`wishViewed:${item.id}`) === 'true';
						star.classList.toggle('is-viewed', isViewed);
						star.style.left = `${position.x}px`;
						star.style.top = `${position.y}px`;
						star.style.setProperty('--star-brightness', `${0.68 + density * 0.32}`);
						star.style.setProperty('--star-size', `${0.55 + random() * 0.42}rem`);
						star.style.setProperty('--star-delay', `${random() * -2.8}s`);
						star.setAttribute('aria-label', `${item.title}（${tag}）の短冊を見る${isViewed ? '・閲覧済み' : ''}`);
						star.title = `${item.title} · ${tag}${isViewed ? ' · 閲覧済み' : ''}`;
						star.addEventListener('click', () => rememberWishListReturn(item, star));

						const point = document.createElement('span');
						point.className = 'wish-sky-star-point';
						point.setAttribute('aria-hidden', 'true');
						point.textContent = '✦';
						star.appendChild(point);
						cluster.appendChild(star);
					});

					wishSkyMap.appendChild(cluster);
				});
		}

		populateSelect(zodiacFilter, 'zodiac', '星座');
		populateSelect(ageFilter, 'ageGroup', '年代');
		populateSelect(genderFilter, 'gender', '性別');
		if (categoryNames.includes(returnCategory) || returnCategory === '未分類' || returnCategory === 'すべて') {
			activeCategory = returnCategory;
		}
		if ([...zodiacFilter.options].some((option) => option.value === returnZodiac)) zodiacFilter.value = returnZodiac;
		if ([...ageFilter.options].some((option) => option.value === returnAge)) ageFilter.value = returnAge;
		if ([...genderFilter.options].some((option) => option.value === returnGender)) genderFilter.value = returnGender;
		if (returnTagQuery) tagSearch.value = returnTagQuery;
		[zodiacFilter, ageFilter, genderFilter].forEach((select) => select.addEventListener('change', renderList));
		tagSearch.addEventListener('input', renderList);
		listViewButton.addEventListener('click', () => setView('list'));
		skyViewButton.addEventListener('click', () => setView('sky'));
		wishSkyCenterButton.addEventListener('click', centerSkyMap);
		let activePointer = null;
		let dragStart = null;
		wishSkyViewport.addEventListener('pointerdown', (event) => {
			if (event.pointerType !== 'mouse' || event.button !== 0 || event.target.closest('a, button')) return;
			activePointer = event.pointerId;
			dragStart = {
				x: event.clientX,
				y: event.clientY,
				left: wishSkyViewport.scrollLeft,
				top: wishSkyViewport.scrollTop
			};
			wishSkyViewport.classList.add('is-dragging');
			wishSkyViewport.setPointerCapture(event.pointerId);
		});
		wishSkyViewport.addEventListener('pointermove', (event) => {
			if (event.pointerId !== activePointer || !dragStart) return;
			wishSkyViewport.scrollLeft = dragStart.left - (event.clientX - dragStart.x);
			wishSkyViewport.scrollTop = dragStart.top - (event.clientY - dragStart.y);
		});
		const stopSkyDrag = (event) => {
			if (event.pointerId !== activePointer) return;
			activePointer = null;
			dragStart = null;
			wishSkyViewport.classList.remove('is-dragging');
		};
		wishSkyViewport.addEventListener('pointerup', stopSkyDrag);
		wishSkyViewport.addEventListener('pointercancel', stopSkyDrag);
		renderFilters();
		renderDuplicateTags();
		renderList();
		setView(returnWishId && returnView === 'sky' ? 'sky' : 'list');
		if (returnWishId) {
			requestAnimationFrame(() => {
				if (returnView === 'sky') {
					wishSkyViewport.scrollLeft = returnSkyLeft;
					wishSkyViewport.scrollTop = returnSkyTop;
					if (Number.isFinite(returnScrollY)) window.scrollTo(0, Math.max(0, returnScrollY));
					return;
				}
				const returnContainer = returnView === 'sky' ? wishSky : wishList;
				const wishLink = [...returnContainer.querySelectorAll('[data-wish-id]')].find((item) => item.dataset.wishId === returnWishId);
				if (wishLink && Number.isFinite(returnCardTop)) {
					window.scrollTo(0, Math.max(0, window.scrollY + wishLink.getBoundingClientRect().top - returnCardTop));
				} else if (Number.isFinite(returnScrollY)) {
					window.scrollTo(0, Math.max(0, returnScrollY));
				}
			});
		}
	</script>

	<script src="javascript_menu/script.js"></script>
</body>
</html>
