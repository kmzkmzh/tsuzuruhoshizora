			const fileNumber = number < 10 ? `00${number}` : number < 100 ? `0${number}` : String(number);

			const category = metadata.category || folderCategories[folder] || '未分類';

				title: `たんざく${padded}`,

		}

		function populateSelect(select, key, label) {
			const values = [...new Set(visibleWishData.map((item) => item[key]).filter(Boolean))].sort();
			select.innerHTML = '';
			const allOption = document.createElement('option');
			allOption.value = '';
			allOption.textContent = values.length ? `${label}すべて` : `${label}未登録`;
			select.appendChild(allOption);
			values.forEach((value) => {
				const option = document.createElement('option');
				option.value = value;
				option.textContent = value;
				select.appendChild(option);
			});
			select.disabled = values.length === 0;
		}

		function renderFilters() {
			tagFilters.innerHTML = '';
			['すべて', ...categoryNames, '未分類'].forEach((category) => {
				const button = document.createElement('button');
				button.type = 'button';
				button.className = 'tag-btn' + (category === activeCategory ? ' active' : '');
				button.textContent = category;
				button.addEventListener('click', () => {
					activeCategory = category;
					renderFilters();
					renderList();
				});
				tagFilters.appendChild(button);
			});
		}

		function renderDuplicateTags() {
			const counts = new Map();
			visibleWishData.forEach((item) => {
				[...new Set(item.tags)]
					.filter((tag) => !categoryNames.includes(tag) && tag !== '未分類')
					.forEach((tag) => counts.set(tag, (counts.get(tag) || 0) + 1));
			});
			const repeated = [...counts.entries()].filter(([, count]) => count > 1);
			duplicateTags.innerHTML = '<span class="duplicate-tags-label">重複タグ:</span>';
			repeated.forEach(([tag, count]) => {
				const button = document.createElement('button');
				button.type = 'button';
				button.className = 'duplicate-tag-btn';
				button.textContent = `${tag} (${count})`;
				button.setAttribute('aria-label', `タグ ${tag} を持つ ${count} 件を表示`);
				button.addEventListener('click', () => {
					tagSearch.value = tag;
					activeCategory = 'すべて';
					renderFilters();
					renderList();
				});
				duplicateTags.appendChild(button);
			});
		}

		function renderList() {
			const query = tagSearch.value.trim().toLocaleLowerCase();
			const filtered = visibleWishData.filter((item) => {
				const matchesCategory = activeCategory === 'すべて' || item.category === activeCategory;
				const matchesZodiac = !zodiacFilter.value || item.zodiac === zodiacFilter.value;
				const matchesAge = !ageFilter.value || item.ageGroup === ageFilter.value;
				const matchesGender = !genderFilter.value || item.gender === genderFilter.value;
				const searchable = item.tags.join(' ').toLocaleLowerCase();
				return matchesCategory && matchesZodiac && matchesAge && matchesGender && (!query || searchable.includes(query));
			});

			wishList.innerHTML = '';
			filterSummary.textContent = `${filtered.length}件 / ${visibleWishData.length}件`;

			filtered.forEach((item) => {
				const card = document.createElement('a');
				card.href = item.url;
				card.className = `wish-card wish-card--${item.categoryColor}`;
				card.dataset.wishId = item.id;
				card.addEventListener('click', () => {
					sessionStorage.setItem('wishListReturnId', item.id);
					sessionStorage.setItem('wishListReturnCardTop', String(card.getBoundingClientRect().top));
					sessionStorage.setItem('wishListReturnScrollY', String(window.scrollY));
					sessionStorage.setItem('wishListReturnCategory', activeCategory);
					sessionStorage.setItem('wishListReturnZodiac', zodiacFilter.value);
					sessionStorage.setItem('wishListReturnAge', ageFilter.value);
					sessionStorage.setItem('wishListReturnGender', genderFilter.value);
					sessionStorage.setItem('wishListReturnTagQuery', tagSearch.value);
				});

				if (item.image) {
					const thumb = document.createElement('div');
					thumb.className = 'wish-thumb';
					const thumbImg = document.createElement('img');
					thumbImg.src = item.image;
					thumbImg.alt = item.title;
					thumbImg.addEventListener('error', () => thumb.remove(), { once: true });
					thumb.appendChild(thumbImg);
					card.appendChild(thumb);
				}

				const body = document.createElement('div');
				body.className = 'wish-body';

				const title = document.createElement('h3');
				title.textContent = item.title;

				const meta = document.createElement('div');
				meta.className = 'wish-meta';

				item.tags.forEach((tag) => {
					const chip = document.createElement('span');
					chip.className = 'wish-tag';
					chip.textContent = tag;
					meta.appendChild(chip);
				});

				body.appendChild(title);
				body.appendChild(meta);
				card.appendChild(body);
				wishList.appendChild(card);
			});
		}

		populateSelect(zodiacFilter, 'zodiac', '星座');
		populateSelect(ageFilter, 'ageGroup', '年代');
		populateSelect(genderFilter, 'gender', '性別');
		if (categoryNames.includes(returnCategory) || returnCategory === '未分類' || returnCategory === 'すべて') {
			activeCategory = returnCategory;
		}
		if ([...zodiacFilter.options].some((option) => option.value === returnZodiac)) zodiacFilter.value = returnZodiac;
		if ([...ageFilter.options].some((option) => option.value === returnAge)) ageFilter.value = returnAge;
		if ([...genderFilter.options].some((option) => option.value === returnGender)) genderFilter.value = returnGender;
		if (returnTagQuery) tagSearch.value = returnTagQuery;
		[zodiacFilter, ageFilter, genderFilter].forEach((select) => select.addEventListener('change', renderList));
		tagSearch.addEventListener('input', renderList);
		renderFilters();
		renderDuplicateTags();
		renderList();
		if (returnWishId) {
			requestAnimationFrame(() => {
				const card = [...wishList.children].find((item) => item.dataset.wishId === returnWishId);
				if (card && Number.isFinite(returnCardTop)) {
					window.scrollTo(0, Math.max(0, window.scrollY + card.getBoundingClientRect().top - returnCardTop));
				} else if (Number.isFinite(returnScrollY)) {
					window.scrollTo(0, Math.max(0, returnScrollY));
				}
			});
		}
	</script>

	<script src="javascript_menu/script.js"></script>
</body>
</html>
